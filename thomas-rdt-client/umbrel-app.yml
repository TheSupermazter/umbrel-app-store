manifestVersion: 1.1
id: thomas-rdt-client
# App data only holds RDT-Client's database and logs.
storage:
  dataRoot: data
folderAccess:
  - id: umbrel-downloads
    name: Downloads
    note: Folder that finished downloads are written to, e.g. External/PS4HDD/Nordflix. Available inside RDT-Client at /data/downloads, which is its default download path.
    mounts:
      - service: server
        targetPath: /data/downloads
        readOnly: false
category: files
name: RDT-Client
version: "2.0.142"
tagline: Download from Real-Debrid or TorBox to your own drive
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/rdt-client.png
description: >-
  RDT-Client is a web interface to manage torrents on Real-Debrid, TorBox,
  AllDebrid, Premiumize or DebridLink. Add a magnet or torrent file, and when
  the debrid service has finished it, RDT-Client downloads the files to your
  own drive and unpacks them.


  The first username and password you enter when you open the app become your
  login. Then open Settings, choose your provider and enter its API key. The
  key is stored only on your Umbrel.


  Downloads are written to the folder selected for this app, which is your
  Downloads folder unless you change it. Keep the download path in RDT-Client
  set to /data/downloads.


  RDT-Client also imitates the qBittorrent API, so Sonarr and Radarr can use
  it as a download client.
releaseNotes: ""
developer: Roger Far
website: https://github.com/rogerfar/rdt-client
dependencies: []
repo: https://github.com/rogerfar/rdt-client
support: https://github.com/rogerfar/rdt-client/issues
permissions:
  - STORAGE_DOWNLOADS
port: 6500
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: Thomas Norden
submission: https://github.com/TheSupermazter/umbrel-app-store
