version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<docker-service-name>_1
      APP_HOST: thomas-file-share_server_1
      APP_PORT: 80
      # FileBrowser Quantum has its own login (it is also reached from the
      # internet through Caddy), so no second Umbrel login in front of it.
      PROXY_AUTH_ADD: "false"

  server:
    image: gtstef/filebrowser:1.5.6-stable-slim@sha256:2adb06e46e1bdbed38e76eb4bcb562fbce0bef0a2bdcbb17f0a2002e4844a24d
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 30s
    environment:
      TZ: Europe/Amsterdam
      # config.yaml is rendered by Umbrel from config.yaml.template.
      FILEBROWSER_CONFIG: /app/config.yaml
      FILEBROWSER_DATABASE: /home/filebrowser/data/database.db
      # Applied at every start: the admin password is always the one Umbrel
      # shows on the app page.
      FILEBROWSER_ADMIN_PASSWORD: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}:/app:ro
      - ${APP_DATA_DIR}/data:/home/filebrowser/data
      # The shared folder, read-only.
      - ${UMBREL_ROOT}/home/Downloads:/srv:ro
