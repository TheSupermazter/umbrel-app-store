version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<docker-service-name>_1
      APP_HOST: thomas-caddy_server_1
      APP_PORT: 8080

  server:
    image: caddy:2.11.6-alpine@sha256:c776e0c6413b544d0459665e54ec7b8b2a15000c0cbee8b254da0067b1d184ff
    restart: on-failure
    stop_grace_period: 30s
    # Caddyfile is rendered by Umbrel from Caddyfile.template in the app folder.
    command: ["caddy", "run", "--config", "/app/Caddyfile", "--adapter", "caddyfile"]
    ports:
      # The router forwards public TCP 443 to this port.
      - 40443:443
    environment:
      TZ: Europe/Amsterdam
    volumes:
      - ${APP_DATA_DIR}:/app:ro
      # Certificates and Caddy's own state.
      - ${APP_DATA_DIR}/data/data:/data
      - ${APP_DATA_DIR}/data/config:/config
